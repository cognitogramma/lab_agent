<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Figure ledger</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f25; --line: #2c313a; --text: #e6e8eb;
    --dim: #9aa2ad; --accent: #4d9de0; --danger: #e05252; --ok: #3fb950;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif;
    display: grid; grid-template-columns: 300px 1fr; height: 100vh;
  }
  aside { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .side-head { padding: 10px; border-bottom: 1px solid var(--line); }
  .side-head input { width: 100%; }
  .filters { display: flex; gap: 4px; margin-top: 8px; }
  .filters button { flex: 1; }
  #list { overflow-y: auto; flex: 1; }
  .item {
    padding: 7px 10px; cursor: pointer; border-bottom: 1px solid #23262c;
    display: flex; gap: 7px; align-items: center; font-size: 12.5px;
  }
  .item:hover { background: #232830; }
  .item.active { background: #2a3agit; background: #283040; }
  .item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #3a3f48; flex: none; }
  .dot.done { background: var(--ok); }
  main { display: grid; grid-template-rows: auto 1fr; min-height: 0; min-width: 0; }
  header {
    padding: 8px 14px; border-bottom: 1px solid var(--line);
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  }
  header .path { color: var(--dim); font-size: 12px; flex: 1; min-width: 120px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .panes { display: grid; grid-template-columns: minmax(280px, 45%) 1fr; min-height: 0; }
  .viewer {
    border-right: 1px solid var(--line); padding: 12px; overflow: auto;
    display: flex; align-items: flex-start; justify-content: center;
  }
  .viewer img { max-width: 100%; background: #fff; border-radius: 4px; }
  .cannot { color: var(--danger); padding: 20px; text-align: center; }
  form { overflow-y: auto; padding: 12px 16px 60px; }
  fieldset { border: 1px solid var(--line); border-radius: 6px; margin: 0 0 14px; padding: 10px 12px; }
  legend { color: var(--accent); font-weight: 600; padding: 0 5px; font-size: 12px;
    letter-spacing: .04em; text-transform: uppercase; }
  label.row { display: grid; grid-template-columns: 130px 1fr; gap: 8px;
    align-items: center; margin-bottom: 7px; }
  label.row > span { color: var(--dim); font-size: 12.5px; }
  input[type=text], textarea, select {
    background: #0f1115; color: var(--text); border: 1px solid var(--line);
    border-radius: 4px; padding: 5px 7px; font: inherit; width: 100%;
  }
  textarea { min-height: 68px; resize: vertical; }
  input:focus, textarea:focus, select:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
  input.bad { border-color: var(--danger); }
  .err { color: var(--danger); font-size: 12px; margin: -3px 0 7px 138px; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip {
    border: 1px solid var(--line); border-radius: 14px; padding: 3px 10px;
    cursor: pointer; user-select: none; font-size: 12.5px; background: #0f1115;
  }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #08101a; font-weight: 600; }
  .chip.danger.on { background: var(--danger); border-color: var(--danger); color: #fff; }
  .sub { margin: 6px 0 0 14px; padding-left: 10px; border-left: 2px solid var(--line); }
  .sub-title { color: var(--dim); font-size: 12px; margin-bottom: 4px; }
  button {
    background: #262b33; color: var(--text); border: 1px solid var(--line);
    border-radius: 4px; padding: 5px 11px; cursor: pointer; font: inherit;
  }
  button:hover { background: #303640; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #08101a; font-weight: 600; }
  #status { font-size: 12px; color: var(--dim); min-width: 90px; }
  #status.saved { color: var(--ok); }
  #status.error { color: var(--danger); }
  .empty { padding: 40px; color: var(--dim); text-align: center; }
</style>
</head>
<body>
<aside>
  <div class="side-head">
    <input id="filter" type="text" placeholder="Filter by filename…">
    <div class="filters">
      <button data-scope="all" class="primary">All</button>
      <button data-scope="todo">To do</button>
      <button data-scope="done">Done</button>
    </div>
  </div>
  <div id="list"></div>
</aside>

<main>
  <header>
    <button id="prev" title="Left arrow">←</button>
    <button id="next" title="Right arrow">→</button>
    <span class="path" id="current">—</span>
    <span id="status"></span>
    <button id="copy" class="primary" title="Carry the previous record forward">Copy previous</button>
    <button id="clear">Clear</button>
    <a href="/export.csv" download><button>CSV</button></a>
  </header>
  <div class="panes">
    <div class="viewer" id="viewer"></div>
    <form id="form" autocomplete="off"></form>
  </div>
</main>

<script>
// ---------------------------------------------------------------------------
// VOCABULARY. Everything the form offers comes from here -- add a term and it
// appears in the UI with no other change. Field names are deliberately stable
// so that panel-level records can extend them later without a migration.
// ---------------------------------------------------------------------------
const VOCAB = {
  dateKind: ["Acquired", "Published"],
  classification: ["Confidential", "Non-confidential"],

  methods: ["DLS", "SLS", "Viscometry", "Fluorimeter", "UV/Visible", "Raman",
            "Circular dichroism"],

  // Measured quantities are kept separate from methods on purpose: DH and
  // Kc/Ir are quantities, and a search for "everything with Kc/Ir vs c" fails
  // if the quantity is buried inside the method that produced it.
  measuredBy: {
    "DLS": ["DH", "Q", "kcps", "Diffusion coeff", "Ir", "Kc/Ir"],
    "SLS": ["Ir", "Kc/I"],
    "Viscometry": ["Raw data", "Reduced viscosity"],
    "Fluorimeter": [], "UV/Visible": [], "Raman": [], "Circular dichroism": [],
  },

  sampleType: ["Synthetic polymer", "RNA", "Protein", "Vaccine", "Other"],
  proteinClass: ["Monoclonal antibody", "Globular", "Non-globular"],

  goals: {
    "Equilibrium characterization": ["ACD", "Manual"],
    "Kinetics": ["Aggregation", "Hydrolysis", "Dissolution"],
    "Thermal": ["Temperature scans", "Iso-T"],
    "Dialysis": ["NaCl", "Guanidine-HCl (Gdn)", "pH"],
    "Iso-chemical": ["Ionic strength", "pH", "Denaturant"],
  },

  text: [
    ["organization", "Organization", "Moderna, Bachem, Tulane…"],
    ["projectType", "Project type", "mRNA, lipid nanoparticles, liraglutides…"],
    ["sampleName", "Sample name", ""],
    ["concentration", "Concentration", "5e-5 g/cm³"],
    ["ph", "pH", ""],
    ["buffer", "Buffer", "32.5 mM sodium acetate"],
    ["temp", "Temperature", "25 C"],
  ],
};

const LIST_FIELDS = ["methods", "measured", "goals", "goalDetails"];
const STATE = __INITIAL_STATE__;

let current = null;      // image path currently open
let filtered = [];       // image entries after filter + scope
let scope = "all";
let saveTimer = null;
let lastSavedImage = null;   // what "Copy previous" carries forward

const $ = (id) => document.getElementById(id);
const byPath = new Map(STATE.images.map((entry) => [entry.image, entry]));

function record(image) {
  if (!STATE.records[image]) {
    STATE.records[image] = {
      image, filename: image.split("/").pop(),
      methods: [], measured: [], goals: [], goalDetails: [],
    };
  }
  return STATE.records[image];
}

// A record counts as logged with a method, a sample type, and a goal.
const isLogged = (r) =>
  !!(r && (r.methods || []).length && r.sampleType && (r.goals || []).length);

// --- date -------------------------------------------------------------------
// Archive material often carries only a year. Forcing a full date would mean
// inventing a month and a day that then look like data.
function checkDate(text) {
  const value = (text || "").trim();
  if (!value) return { precision: "none", error: "" };
  const shape = /^(\d{4})(?:-(\d{2})(?:-(\d{2}))?)?$/.exec(value);
  if (!shape) return { precision: "none", error: "Use YYYY, YYYY-MM, or YYYY-MM-DD." };

  const [, y, m, d] = shape;
  const year = +y;
  if (year < 1800 || year > 2200) return { precision: "none", error: `Year ${year} is out of range.` };
  if (m !== undefined && (+m < 1 || +m > 12)) return { precision: "none", error: `Month ${m} does not exist.` };
  if (d !== undefined) {
    const last = new Date(year, +m, 0).getDate();
    if (+d < 1 || +d > last) return { precision: "none", error: `${value} does not exist — that month has ${last} days.` };
  }
  return { precision: d !== undefined ? "day" : m !== undefined ? "month" : "year", error: "" };
}

// --- sidebar ----------------------------------------------------------------
function renderList() {
  const needle = $("filter").value.trim().toLowerCase();
  filtered = STATE.images.filter((entry) => {
    if (needle && !entry.image.toLowerCase().includes(needle)) return false;
    const done = isLogged(STATE.records[entry.image]);
    return scope === "all" || (scope === "done" ? done : !done);
  });

  const list = $("list");
  list.innerHTML = "";
  if (!filtered.length) {
    list.innerHTML = '<div class="empty">Nothing matches.</div>';
    return;
  }
  for (const entry of filtered) {
    const row = document.createElement("div");
    row.className = "item" + (entry.image === current ? " active" : "");
    row.innerHTML =
      `<span class="dot${isLogged(STATE.records[entry.image]) ? " done" : ""}"></span>` +
      `<span class="name" title="${entry.image}">${entry.image}</span>`;
    row.onclick = () => open(entry.image);
    list.appendChild(row);
  }
}

// --- form -------------------------------------------------------------------
function chips(field, options, { danger = false, single = false } = {}) {
  const box = document.createElement("div");
  box.className = "chips";
  const r = record(current);
  for (const option of options) {
    const chip = document.createElement("span");
    const on = single ? r[field] === option : (r[field] || []).includes(option);
    chip.className = "chip" + (on ? " on" : "") +
      (danger && option === "Confidential" ? " danger" : "");
    chip.textContent = option;
    chip.onclick = () => {
      if (single) {
        r[field] = r[field] === option ? "" : option;
      } else {
        const list = r[field] || (r[field] = []);
        const at = list.indexOf(option);
        at === -1 ? list.push(option) : list.splice(at, 1);
      }
      renderForm();
      queueSave();
    };
    box.appendChild(chip);
  }
  return box;
}

function textRow(field, label, placeholder) {
  const r = record(current);
  const row = document.createElement("label");
  row.className = "row";
  row.innerHTML = `<span>${label}</span>`;
  const input = document.createElement("input");
  input.type = "text";
  input.value = r[field] || "";
  input.placeholder = placeholder || "";
  input.oninput = () => { r[field] = input.value; queueSave(); };
  row.appendChild(input);
  return row;
}

function group(title) {
  const set = document.createElement("fieldset");
  set.innerHTML = `<legend>${title}</legend>`;
  return set;
}

function renderForm() {
  const form = $("form");
  form.innerHTML = "";
  if (!current) {
    form.innerHTML = '<div class="empty">Select an image.</div>';
    return;
  }
  const r = record(current);

  // Date
  const dateSet = group("Date");
  const dateRow = document.createElement("label");
  dateRow.className = "row";
  dateRow.innerHTML = "<span>Date</span>";
  const dateInput = document.createElement("input");
  dateInput.type = "text";
  dateInput.value = r.date || "";
  dateInput.placeholder = "2021  ·  2021-06  ·  2021-06-14";
  const error = document.createElement("div");
  error.className = "err";
  const validate = () => {
    const checked = checkDate(dateInput.value);
    dateInput.classList.toggle("bad", !!checked.error);
    error.textContent = checked.error ||
      (checked.precision !== "none" ? `precision: ${checked.precision}` : "");
    error.style.color = checked.error ? "var(--danger)" : "var(--dim)";
    return checked;
  };
  dateInput.oninput = () => {
    r.date = dateInput.value;
    if (validate().error) { setStatus("date not valid", "error"); return; }
    queueSave();
  };
  dateRow.appendChild(dateInput);
  dateSet.appendChild(dateRow);
  dateSet.appendChild(error);
  validate();
  const kindRow = document.createElement("label");
  kindRow.className = "row";
  kindRow.innerHTML = "<span>Kind</span>";
  kindRow.appendChild(chips("dateKind", VOCAB.dateKind, { single: true }));
  dateSet.appendChild(kindRow);
  form.appendChild(dateSet);

  // Access
  const access = group("Access");
  const classRow = document.createElement("label");
  classRow.className = "row";
  classRow.innerHTML = "<span>Classification</span>";
  classRow.appendChild(chips("classification", VOCAB.classification, { single: true, danger: true }));
  access.appendChild(classRow);
  access.appendChild(textRow("organization", "Organization", "Moderna, Bachem, Tulane…"));
  access.appendChild(textRow("projectType", "Project type", "mRNA, lipid nanoparticles…"));
  form.appendChild(access);

  // I · Methods
  const methods = group("I · Methods");
  const mRow = document.createElement("div");
  mRow.appendChild(chips("methods", VOCAB.methods));
  methods.appendChild(mRow);

  const available = [];
  for (const method of r.methods || []) {
    for (const quantity of VOCAB.measuredBy[method] || []) {
      if (!available.includes(quantity)) available.push(quantity);
    }
  }
  if (available.length) {
    const sub = document.createElement("div");
    sub.className = "sub";
    sub.innerHTML = '<div class="sub-title">Measured</div>';
    sub.appendChild(chips("measured", available));
    methods.appendChild(sub);
  }
  // Quantities whose method was deselected stay in the record rather than being
  // silently dropped -- losing a label because a chip was toggled is worse than
  // showing one that no longer has a home.
  const orphans = (r.measured || []).filter((q) => !available.includes(q));
  if (orphans.length) {
    const warn = document.createElement("div");
    warn.className = "err";
    warn.style.marginLeft = "0";
    warn.textContent = `kept from a deselected method: ${orphans.join(", ")}`;
    methods.appendChild(warn);
  }
  methods.appendChild(textRow("measuredOther", "Other", "anything not listed"));
  form.appendChild(methods);

  // II · Sample
  const sample = group("II · Sample");
  const typeRow = document.createElement("label");
  typeRow.className = "row";
  typeRow.innerHTML = "<span>Sample type</span>";
  typeRow.appendChild(chips("sampleType", VOCAB.sampleType, { single: true }));
  sample.appendChild(typeRow);
  if (r.sampleType === "Protein") {
    const proteinRow = document.createElement("label");
    proteinRow.className = "row";
    proteinRow.innerHTML = "<span>Protein class</span>";
    proteinRow.appendChild(chips("proteinClass", VOCAB.proteinClass, { single: true }));
    sample.appendChild(proteinRow);
  }
  for (const [field, label, hint] of VOCAB.text.slice(2)) {
    sample.appendChild(textRow(field, label, hint));
  }
  form.appendChild(sample);

  // III · Goal
  const goals = group("III · Goal");
  goals.appendChild(chips("goals", Object.keys(VOCAB.goals)));
  for (const goal of r.goals || []) {
    const options = VOCAB.goals[goal] || [];
    if (!options.length) continue;
    const sub = document.createElement("div");
    sub.className = "sub";
    sub.innerHTML = `<div class="sub-title">${goal}</div>`;
    const box = document.createElement("div");
    box.className = "chips";
    for (const option of options) {
      const key = `${goal}: ${option}`;
      const chip = document.createElement("span");
      chip.className = "chip" + ((r.goalDetails || []).includes(key) ? " on" : "");
      chip.textContent = option;
      chip.onclick = () => {
        const list = r.goalDetails || (r.goalDetails = []);
        const at = list.indexOf(key);
        at === -1 ? list.push(key) : list.splice(at, 1);
        renderForm();
        queueSave();
      };
      box.appendChild(chip);
    }
    sub.appendChild(box);
    goals.appendChild(sub);
  }
  form.appendChild(goals);

  // Notes
  const notes = group("Notes");
  const area = document.createElement("textarea");
  area.value = r.notes || "";
  area.placeholder = "Anything the fields above do not cover.";
  area.oninput = () => { r.notes = area.value; queueSave(); };
  notes.appendChild(area);
  form.appendChild(notes);
}

// --- viewer -----------------------------------------------------------------
function renderViewer() {
  const viewer = $("viewer");
  viewer.innerHTML = "";
  if (!current) { viewer.innerHTML = '<div class="empty">Select an image.</div>'; return; }

  const entry = byPath.get(current);
  if (entry && !entry.displayable) {
    viewer.innerHTML =
      `<div class="cannot"><strong>This is ${entry.format}.</strong><br>` +
      `${entry.note || "Not a format a browser will display."}<br><br>` +
      `<code>${current}</code></div>`;
    return;
  }
  const img = document.createElement("img");
  img.src = "/image/" + current.split("/").map(encodeURIComponent).join("/");
  img.alt = current;
  img.onerror = () => {
    viewer.innerHTML =
      `<div class="cannot"><strong>Could not decode this file.</strong><br>` +
      `Detected as ${entry ? entry.format : "unknown"}.<br><br><code>${current}</code></div>`;
  };
  viewer.appendChild(img);
}

// --- saving -----------------------------------------------------------------
function setStatus(text, kind = "") {
  const node = $("status");
  node.textContent = text;
  node.className = kind;
}

function queueSave() {
  setStatus("editing…");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 400);
  renderList();
}

async function save() {
  if (!current) return;
  const image = current;
  try {
    const response = await fetch("/save", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ image, record: record(image) }),
    });
    const body = await response.json();
    if (!response.ok) { setStatus(body.error || "not saved", "error"); return; }
    STATE.records[image] = body.record;
    lastSavedImage = image;
    setStatus("saved", "saved");
    renderList();
  } catch (error) {
    setStatus("save failed — is the server still running?", "error");
  }
}

// --- navigation -------------------------------------------------------------
function open(image) {
  if (saveTimer) { clearTimeout(saveTimer); save(); }
  current = image;
  $("current").textContent = image;
  setStatus("");
  renderList();
  renderViewer();
  renderForm();
}

function step(delta) {
  if (!filtered.length) return;
  const at = filtered.findIndex((entry) => entry.image === current);
  const next = filtered[Math.min(filtered.length - 1, Math.max(0, at + delta))];
  if (next) open(next.image);
}

// Copy previous: figures from one paper share nearly every field. This is what
// makes the tool usable at scale -- one click, then adjust two fields.
function copyPrevious() {
  if (!current) return;
  const at = filtered.findIndex((entry) => entry.image === current);
  let source = null;
  for (let i = at - 1; i >= 0; i--) {
    const candidate = STATE.records[filtered[i].image];
    if (candidate && isLogged(candidate)) { source = candidate; break; }
  }
  if (!source && lastSavedImage) source = STATE.records[lastSavedImage];
  if (!source) { setStatus("nothing to copy yet", "error"); return; }

  const target = record(current);
  for (const [field, value] of Object.entries(source)) {
    if (["image", "filename", "updated"].includes(field)) continue;
    target[field] = LIST_FIELDS.includes(field) ? [...(value || [])] : value;
  }
  renderForm();
  queueSave();
  setStatus("copied — adjust and it saves", "saved");
}

// --- wiring -----------------------------------------------------------------
$("filter").oninput = () => renderList();
for (const button of document.querySelectorAll(".filters button")) {
  button.onclick = () => {
    scope = button.dataset.scope;
    for (const other of document.querySelectorAll(".filters button")) {
      other.classList.toggle("primary", other === button);
    }
    renderList();
  };
}
$("prev").onclick = () => step(-1);
$("next").onclick = () => step(1);
$("copy").onclick = copyPrevious;
$("clear").onclick = () => {
  if (!current) return;
  STATE.records[current] = {
    image: current, filename: current.split("/").pop(),
    methods: [], measured: [], goals: [], goalDetails: [],
  };
  renderForm();
  queueSave();
};

document.addEventListener("keydown", (event) => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName);
  if (typing || event.metaKey || event.ctrlKey || event.altKey) return;
  if (event.key === "ArrowLeft") { event.preventDefault(); step(-1); }
  if (event.key === "ArrowRight") { event.preventDefault(); step(1); }
});

// Flush anything pending if the tab closes mid-edit.
window.addEventListener("beforeunload", () => {
  if (!saveTimer || !current) return;
  clearTimeout(saveTimer);
  navigator.sendBeacon(
    "/save",
    new Blob([JSON.stringify({ image: current, record: record(current) })],
             { type: "application/json" })
  );
});

renderList();
if (STATE.images.length) open(STATE.images[0].image);
else $("form").innerHTML = '<div class="empty">No images found in this folder.</div>';
</script>
</body>
</html>
