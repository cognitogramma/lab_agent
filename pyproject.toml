[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polyrmc"
version = "0.1.0"
description = "Auditable processing pipeline for ACD light-scattering data"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "pandas>=2.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# Tier 1/2 judging and orchestration. The pipeline runs end to end without
# these, using the deterministic StaticJudge.
judge = [
    "langchain>=1.0",
    "langchain-google-genai>=2.0",
    "langgraph>=1.0",
]

[project.scripts]
polyrmc = "polyrmc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
