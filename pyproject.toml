[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "continuum-spectranalytics"
version = "0.2.0"
description = "Literature review, durable research ideas, and auditable light-scattering analysis"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "pandas>=2.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# Tier 1/2 judging and orchestration. The pipeline runs end to end without any
# of this, using the deterministic StaticJudge, which is why none of it is a
# base dependency.
agent = [
    "langchain>=1.0",
    "langgraph>=1.0",
]

# One per provider, because you buy your own tokens and there is no reason to
# install an SDK for a vendor you will never key. A missing one is reported as
# "pip install <name>" rather than a stack trace.
gemini = ["continuum-spectranalytics[agent]", "langchain-google-genai>=2.0"]
claude = ["continuum-spectranalytics[agent]", "langchain-anthropic>=1.0"]
openai = ["continuum-spectranalytics[agent]", "langchain-openai>=1.0"]

# The old name for the Gemini set. Kept because the README and the lab's own
# notes say `pip install -e .[judge]`, and silently removing an extra fails at
# install time with nothing pointing at the new spelling.
judge = ["continuum-spectranalytics[gemini]"]

# Running the suite. Separate from the base install because a lab machine that
# only processes data does not need it -- but the documented way to verify an
# installation is to run the tests, and `pip install -e .` alone left a fresh
# machine with no pytest and a setup guide whose own verification step failed.
test = ["pytest>=8.0"]

# Internet search is independent of the model providers. arXiv needs only the
# standard library; general web search uses DDGS and needs no API key.
search = ["ddgs>=9.0,<10"]
gui = ["customtkinter>=5.2,<6"]

all = ["continuum-spectranalytics[gemini,claude,openai,test,search,gui]"]
windows-build = ["continuum-spectranalytics[gemini,claude,openai,search,gui]", "pyinstaller>=6.22.3,<7"]

[project.scripts]
continuum-spectranalytics = "continuum_spectranalytics.cli:main"

[project.urls]
Repository = "https://github.com/cognitogramma/lab_agent"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
continuum_spectranalytics = ["agent/prompts/*.md", "assets/*.ico"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
